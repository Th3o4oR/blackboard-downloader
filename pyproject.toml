[project]
name = "blackboard-downloader"
version = "0.3.0"
description = "Tool for automatic downloading of course content from Blackboard Learn."
readme = "README.md"
authors = [
    { name = "boranxiang", email = "151702057+boranxiang@users.noreply.github.com" },
    { name = "Theodor Johansson", email = "theodor.lund.johansson@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.11.0",
    "playwright>=1.62.0",
    "requests>=2.28.0",
    "rich>=15.0.0",
]

[project.scripts]
blackboard-downloader = "blackboard_downloader.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
